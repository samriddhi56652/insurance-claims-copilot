<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292">
<rect width="900" height="292" fill="#FFFFFF"/>
<rect x="96" y="52" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="168.0" y="74.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#1F2328" text-anchor="middle">1 Intake</text>
<rect x="96" y="100" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="168.0" y="128.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">Screens the claim and</text>
<text x="168.0" y="143.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">drafts the first request</text>
<rect x="96" y="176" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="168.0" y="204.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">Reviews, edits and</text>
<text x="168.0" y="219.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">approves the draft</text>
<rect x="258" y="52" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="330.0" y="74.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#1F2328" text-anchor="middle">2 Awaiting documents</text>
<rect x="258" y="100" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="330.0" y="120.8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">Builds the checklist;</text>
<text x="330.0" y="136.2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">drafts chasers as</text>
<text x="330.0" y="151.6" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">replies arrive</text>
<rect x="258" y="176" width="144" height="64" rx="6" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.2"/>
<text x="330.0" y="204.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0550AE" text-anchor="middle">Verifies each</text>
<text x="330.0" y="219.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0550AE" text-anchor="middle">document</text>
<polyline points="242.0,69.0 247.0,69.0" fill="none" stroke="#8C959F" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="256.0,69.0 247.0,72.8 247.0,65.2" fill="#8C959F"/>
<rect x="420" y="52" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="492.0" y="74.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#1F2328" text-anchor="middle">3 Review ready</text>
<rect x="420" y="100" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="492.0" y="120.8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">Drafts the</text>
<text x="492.0" y="136.2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">preliminary coverage</text>
<text x="492.0" y="151.6" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">recommendation</text>
<rect x="420" y="176" width="144" height="64" rx="6" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.2"/>
<text x="492.0" y="204.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0550AE" text-anchor="middle">Approves or changes</text>
<text x="492.0" y="219.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0550AE" text-anchor="middle">the recommendation</text>
<polyline points="404.0,69.0 409.0,69.0" fill="none" stroke="#8C959F" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="418.0,69.0 409.0,72.8 409.0,65.2" fill="#8C959F"/>
<rect x="582" y="52" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="654.0" y="74.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#1F2328" text-anchor="middle">4 Settlement</text>
<rect x="582" y="100" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="654.0" y="128.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#656D76" text-anchor="middle">No AI step:</text>
<text x="654.0" y="143.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#656D76" text-anchor="middle">human only</text>
<rect x="582" y="176" width="144" height="64" rx="6" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.2"/>
<text x="654.0" y="204.5" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0550AE" text-anchor="middle">Records the decision,</text>
<text x="654.0" y="219.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0550AE" text-anchor="middle">repair and payment</text>
<polyline points="566.0,69.0 571.0,69.0" fill="none" stroke="#8C959F" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="580.0,69.0 571.0,72.8 571.0,65.2" fill="#8C959F"/>
<rect x="744" y="52" width="144" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="816.0" y="74.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#1F2328" text-anchor="middle">5 Closed</text>
<rect x="744" y="100" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="816.0" y="120.8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">Drafts the closure</text>
<text x="816.0" y="136.2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">notice; saves the outcome</text>
<text x="816.0" y="151.6" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">to customer memory</text>
<rect x="744" y="176" width="144" height="64" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="816.0" y="212.2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#1F2328" text-anchor="middle">Approves the notice</text>
<polyline points="728.0,69.0 733.0,69.0" fill="none" stroke="#8C959F" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="742.0,69.0 733.0,72.8 733.0,65.2" fill="#8C959F"/>
<text x="8.0" y="136.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#656D76" text-anchor="start">Copilot</text>
<text x="8.0" y="212.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#656D76" text-anchor="start">Adjuster</text>
<polyline points="816.0,50.0 816.0,30.0 168.0,30.0 168.0,41.0" fill="none" stroke="#8C959F" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="168.0,50.0 164.2,41.0 171.8,41.0" fill="#8C959F"/>
<text x="492.0" y="21.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#656D76" text-anchor="middle">A closed claim's outcome becomes the customer's history for their next claim</text>
<rect x="96" y="264" width="22" height="14" rx="3" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.2"/>
<text x="128.0" y="275.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#656D76" text-anchor="start">The adjuster makes a decision on the claim itself, not only approving a draft</text>
</svg>